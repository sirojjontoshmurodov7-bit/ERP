# Har push va PR: lint, unit, build, e2e (PGlite va haqiqiy Postgres 17), Docker obrazlari yig'iladi (push qilinmaydi).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lint
        run: |
          pnpm --filter @erp/api lint
          pnpm --filter @erp/web lint
      - name: Web typecheck
        run: pnpm --filter @erp/web typecheck
      - name: Unit testlar
        run: |
          pnpm --filter @erp/api test
          pnpm --filter @erp/web test
      - name: E2E (PGlite)
        run: pnpm --filter @erp/api test:e2e
      - name: E2E (haqiqiy Postgres 17, superuser bo'lmagan egasi bilan migratsiya)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @erp/api test:e2e

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: erp-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: erp-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

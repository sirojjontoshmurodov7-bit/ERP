# Har push va PR: lint, unit, build, e2e (PGlite va haqiqiy Postgres 17), Docker obrazlari yig'iladi (push qilinmaydi).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lint
        run: |
          pnpm --filter @erp/api lint
          pnpm --filter @erp/web lint
      - name: Web typecheck
        run: pnpm --filter @erp/web typecheck
      - name: Unit testlar
        run: |
          pnpm --filter @erp/api test
          pnpm --filter @erp/web test
      - name: E2E (PGlite)
        run: pnpm --filter @erp/api test:e2e
      - name: E2E (haqiqiy Postgres 17, superuser bo'lmagan egasi bilan migratsiya)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @erp/api test:e2e

  # Brauzer e2e: haqiqiy stack (Postgres 17 + API + Next production) va Playwright (Chromium)
  e2e-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://erp_app:erp_app_password@localhost:5432/erp
      DATABASE_MIGRATION_URL: postgresql://erp:erp_dev_password@localhost:5432/erp
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      API_PORT: "3001"
      E2E_ROOT_LOGIN: e2e.root
      E2E_ROOT_PASSWORD: Ci-Root-Password-1
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Baza rollari (egasi va ilova roli superuser emas, production kabi)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE erp LOGIN NOSUPERUSER CREATEDB PASSWORD 'erp_dev_password'"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE erp_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'erp_app_password'"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE erp OWNER erp"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE erp TO erp_app"
      - name: Migratsiya, seed, e2e super admin
        run: |
          touch .env
          pnpm --filter @erp/api db:migrate
          pnpm --filter @erp/api db:seed
          SUPER_ADMIN_LOGIN="$E2E_ROOT_LOGIN" SUPER_ADMIN_PASSWORD="$E2E_ROOT_PASSWORD" pnpm --filter @erp/api db:create-super-admin
      - name: API va web'ni ishga tushirish
        run: |
          nohup node apps/api/dist/main > api.log 2>&1 &
          (cd apps/web && API_URL=http://localhost:3001 WEB_SECURE_COOKIES=false nohup node node_modules/next/dist/bin/next start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null && curl -sf -o /dev/null http://localhost:3000/login; then echo "tayyor"; exit 0; fi
            sleep 2
          done
          echo "Serverlar ishga tushmadi"; tail -50 api.log web.log; exit 1
      - name: Playwright
        run: |
          pnpm --filter @erp/web exec playwright install --with-deps chromium
          pnpm --filter @erp/web e2e
      - name: Hisobot va loglar (xatoda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            web.log
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: erp-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: erp-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Bitta servis obrazi (Render, bepul bulut)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.render
          push: false
          tags: tst-erp:ci
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render
